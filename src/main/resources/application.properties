# Nom de l'application
spring.application.name=SujetStage

# Configuration base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/Evaluation
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# HikariCP (pool de connexion)
spring.datasource.hikari.auto-commit=false

# Port du serveur
server.port=8081

# Configuration des fichiers uploadés
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads

# Configuration Mail Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=amounatahfouna443@gmail.com
spring.mail.password=wccjfzlronurtbxz
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Sécurité : désactiver la configuration automatique de UserDetailsService
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Niveau de logs
logging.level.org.springframework.security=DEBUG
logging.level.com.example.SujetStage=DEBUG

# Configuration JWT
jwt.secret-key=c2VjcmV0X2tleV9sb25ndWUyNTZiaXRzX2VuY29kZWQ=
jwt.expiration=86400000
# 86400000 = 24h en millisecondes (1 jour)

# Autoriser les références circulaires (si nécessaire)
spring.main.allow-circular-references=true
